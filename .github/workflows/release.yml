name: Release

# A tag like v1.2.0 makes a release: the tests, a build for any Mac, signed
# with the Developer ID and notarised by Apple, published on the repository's
# Releases page. The app's updater and the website's Download button take it from there.
#
# Make one with ./scripts/release.sh 1.2.0 (it checks the checkout and pushes the tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # by hand, to check the build without a release

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Before anything is built: a broken build must not reach people,
      # and this workflow publishes the release itself.
      - name: Test
        run: go test ./...

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="0.0.0"; fi
          ./scripts/build.sh --release "$VERSION"

      # The certificate lives in the repository secrets: a runner has no
      # keychain of its own, so we make a temporary one, put the key in it and
      # delete it at the end. Without the secrets the build stays unsigned
      # and nothing is published (see the last step).
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No certificate in the secrets: the build stays unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # without this codesign would ask for a password, and there is nobody to ask
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "The certificate imported, but no Developer ID is visible: check MACOS_CERT_P12 and its password."
            exit 1
          fi

      - name: Sign, notarise and pack
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "Unsigned build: nothing to sign."
            exit 0
          fi
          packaging/sign_macos.sh

      # A signature nobody checked is worth nothing: spoiling one silently is easy.
      - name: Check that Gatekeeper accepts it
        run: |
          if [ ! -f dist/Disk-Cleaner.dmg ]; then
            echo "Nothing was signed: no release will be published."
            exit 0
          fi
          codesign --verify --deep --strict "dist/Disk Cleaner.app"
          spctl -a -vvv -t exec "dist/Disk Cleaner.app"
          spctl -a -vvv -t open --context context:primary-signature dist/Disk-Cleaner.dmg
          xcrun stapler validate "dist/Disk Cleaner.app"
          xcrun stapler validate dist/Disk-Cleaner.dmg

      - name: Remove the signing keychain
        if: always()
        run: |
          security list-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # Only signed and notarised builds are published: an unsigned one would
      # make macOS say "the developer cannot be verified" to everyone.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('dist/Disk-Cleaner.dmg') != ''
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Disk-Cleaner.dmg
            dist/Disk-Cleaner.zip
          generate_release_notes: true
